services:
  - type: web
    name: django-recipe-api
    runtime: python
    plan: free
    buildCommand: ./build.sh
    startCommand: python -m gunicorn --chdir app app.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.3
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: False
      - key: ALLOWED_HOSTS
        value: .onrender.com
      - key: CSRF_TRUSTED_ORIGINS
        value: https://*.onrender.com
      - key: DATABASE_URL
        fromDatabase:
          name: django-recipe-api-db
          property: connectionString

databases:
  - name: django-recipe-api-db
    plan: free
